<?xml version="1.0" encoding="UTF-8"?>
<svg
    xmlns="http://www.w3.org/2000/svg"
    width="140"
    height="140"
    viewBox="0 0 120 120"
    preserveAspectRatio="xMidYMid meet">

  <!-- Outer shape -->
  <polygon
    points="60,10 95,30 95,70 60,90 25,70 25,30"
    fill="none"
    stroke="#FFF8EF"
    stroke-width="4"
    stroke-linecap="round"
    stroke-linejoin="round"/>

  <!-- Bee body -->
  <ellipse
    cx="60"
    cy="52"
    rx="13"
    ry="9"
    fill="#FFF8EF"/>

  <!-- Bee stripes -->
  <line x1="55" y1="44" x2="55" y2="60"
        stroke="#111111"
        stroke-width="2.2"
        stroke-linecap="round"/>

  <line x1="61" y1="44" x2="61" y2="60"
        stroke="#111111"
        stroke-width="2.2"
        stroke-linecap="round"/>

  <!-- Wings -->
  <ellipse
    cx="48"
    cy="40"
    rx="8"
    ry="13"
    transform="rotate(-28 48 40)"
    fill="none"
    stroke="#FFF8EF"
    stroke-width="2.8"/>

  <ellipse
    cx="72"
    cy="40"
    rx="8"
    ry="13"
    transform="rotate(28 72 40)"
    fill="none"
    stroke="#FFF8EF"
    stroke-width="2.8"/>

  <!-- Antennas -->
  <path
    d="M54 45 C46 36, 42 36, 38 42"
    fill="none"
    stroke="#FFF8EF"
    stroke-width="2.2"
    stroke-linecap="round"/>

  <circle cx="38" cy="42" r="2" fill="#FFF8EF"/>

  <path
    d="M66 45 C74 36, 78 36, 82 42"
    fill="none"
    stroke="#FFF8EF"
    stroke-width="2.2"
    stroke-linecap="round"/>

  <circle cx="82" cy="42" r="2" fill="#FFF8EF"/>
</svg>
